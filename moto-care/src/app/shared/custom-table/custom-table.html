<div
    class="custom-table-container mat-elevation-z2 bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
    <div class="table-scroll-wrapper overflow-auto max-h-[500px]">
        <table mat-table [dataSource]="dataSource" matSort class="w-full min-w-max bg-white">

            @for (col of columns(); track col.key) {
            <ng-container [matColumnDef]="col.key">


                <th mat-header-cell *matHeaderCellDef [mat-sort-header]="col.key" [disabled]="col.sortable === false"
                    [style.width]="col.width" [style.min-width]="col.width"
                    class="text-gray-900 font-bold tracking-wider text-xs uppercase border-b border-gray-200 px-4 py-3 bg-gray-50">
                    {{ col.label }}
                </th>

                <td mat-cell *matCellDef="let row" [style.width]="col.width" [style.min-width]="col.width"
                    class="text-gray-700 text-sm border-b border-gray-100 px-4 py-3">

                    @if (getCustomTemplate(col.key); as template) {
                    <ng-container *ngTemplateOutlet="template; context: { $implicit: row }"></ng-container>
                    }
                    @else {
                    {{ row[col.key] }}
                    }

                </td>
            </ng-container>
            }

            <tr mat-header-row *matHeaderRowDef="displayedColumns(); sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns();" class="transition-colors duration-200"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell text-center py-8 text-gray-500" [attr.colspan]="displayedColumns().length">
                    No hay registros para mostrar.
                </td>
            </tr>
        </table>
    </div>

    <mat-paginator [pageSizeOptions]="pageSizeOptions()" [pageSize]="defaultPageSize()" showFirstLastButtons
        class="bg-white text-gray-600 border-t border-gray-200 rounded-b-xl">
    </mat-paginator>
</div>
