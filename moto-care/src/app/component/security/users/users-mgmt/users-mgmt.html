<div class="p-6 md:p-10 animate-fade-in">
  <div class="mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-[#10152b]">Gestión de Usuarios</h1>
      <p class="text-slate-500">Administración de usuarios y accesos del sistema</p>
    </div>
    <button mat-flat-button color="primary" class="!rounded-lg" (click)="openAddUserDialog()">
      <mat-icon>add</mat-icon>
      Nuevo Usuario
    </button>
  </div>

  <app-custom-table [data]="users()" [columns]="tableColumns" class="block w-full">
    <ng-template appTableColumn="status" let-user>
      <span class="px-2 py-1 text-white rounded-full text-xs font-medium" 
            [ngClass]="user.status === 'Activo' ? 'bg-green-500' : 'bg-red-500'">
            {{ user.status || 'Activo' }}
      </span>
    </ng-template>
    <ng-template appTableColumn="actions" let-user>
      <div class="flex items-center gap-3">
        <button mat-icon-button class="!w-8 !h-8 bg-blue-500/10 hover:bg-blue-500/20" title="Editar" (click)="editUser(user)">
          <mat-icon fontSet="material-symbols-outlined" class="text-sm text-blue-600">edit</mat-icon>
        </button>
        <mat-slide-toggle 
          color="primary" 
          [checked]="user.status === 'Activo'"
          (change)="toggleUserStatus(user)"
          matTooltip="{{ user.status === 'Activo' ? 'Desactivar Usuario' : 'Activar Usuario' }}">
        </mat-slide-toggle>
      </div>
    </ng-template>
  </app-custom-table>
</div>
