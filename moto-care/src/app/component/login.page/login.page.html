<div class="min-h-screen w-full bg-[#10152b] flex items-center justify-center relative overflow-hidden">

    <img src="background.jpg" alt="Moto Background"
        class="fixed inset-0 w-full h-full object-cover opacity-10 pointer-events-none z-0">


    <div
        class="bg-white w-[420px] z-20 flex flex-col p-10 rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.15)] transition-all">
        <img src="moto-care.png" class="h-10 w-auto object-contain transition-transform duration-300 hover:scale-110"
            alt="MotoCare Logo">
        <p class="text-center text-slate-500 mb-8 text-sm">Ingresa tus credenciales para continuar</p>

        <form (ngSubmit)="onLogin()">
            <div class="mb-5">
                <label for="username" class="block text-xs font-semibold text-slate-600 uppercase mb-2">Usuario</label>
                <input type="text" id="username" name="username" [ngModel]="username()"
                    (ngModelChange)="username.set($event)"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10152b] transition-all">
            </div>
            <div class="mb-6">
                <label for="password"
                    class="block text-xs font-semibold text-slate-600 uppercase mb-2">Contraseña</label>
                <input type="password" id="password" name="password" [ngModel]="password()"
                    (ngModelChange)="password.set($event)"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10152b] transition-all">
            </div>

            @if (error()) {
            <p class="text-red-500 text-xs mb-4 text-center">{{ error() }}</p>
            }

            <button type="submit"
                class="w-full bg-[#10152b] text-white py-3 rounded-lg font-bold hover:bg-slate-900 transition-all shadow-md disabled:opacity-60">
                Iniciar sesión
            </button>

            <div class="flex items-center justify-center mt-6">
                <a href="#" class="text-xs text-slate-400 hover:text-[#10152b] transition-colors">¿Olvidaste tu
                    contraseña?</a>
            </div>
        </form>
    </div>
</div>
