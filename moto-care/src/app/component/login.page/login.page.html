<!--HEADER -->
<div
    class="absolute top-0 left-0 w-full h-20 z-50 flex justify-between items-center px-12 bg-black border-b border-white/10">
    <img src="moto-care.png" class="h-10 w-auto object-contain" alt="Olvest Logo">

</div>

<!--BODY -->
<div class="min-h-screen w-full bg-slate-700 flex items-center justify-center relative overflow-hidden">
    <img src="background.jpg" alt="Moto Background"
        class="absolute right-0 bottom-0 h-[100%] w-auto object-contain opacity-30 grayscale pointer-events-none z-10">

    <div class="bg-white absolute w-[450px] min-h-[500px] z-20 flex flex-col p-12 transition-all">
        <h2 class="text-3xl text-center mb-6">Bienvenido a MotoCare</h2>
        <p class="text-center text-gray-600 mb-8">Inicia sesión para continuar</p>

        <form action="">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 mb-2">Correo electrónico</label>
                <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 mb-2">Contraseña</label>
                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <button type="submit" class="w-full bg-black text-white py-2 rounded-md">Iniciar sesión</button>

            <div class="flex items-center justify-between mt-4">
                <a href="#" class="text-black hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>
</div>

<!--FOOTER -->
<div class="absolute bottom-0 left-0 w-full z-50 flex justify-between items-center px-12 py-10 bg-black">

</div>
